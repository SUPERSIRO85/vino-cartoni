<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vino da vendere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Young+Serif&display=swap">
<style>
/* Layout: una colonna stretta pensata per il telefono. Nome, vini con pulsanti − e +, totale, Ordina. In fondo gli ordini confermati. */
:root {
  --bg: #f5f3f6;
  --surface: #ffffff;
  --cell: #faf8fb;
  --line: #ddd6e0;
  --fg: #231a26;
  --muted: #6d6172;
  --accent: #7a2238;
  --accent-fg: #ffffff;
  --ok: #2f7a4d;
  --warn: #a2541b;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17121a;
    --surface: #211a25;
    --cell: #2a2230;
    --line: #3b3042;
    --fg: #f0e9f2;
    --muted: #a998ae;
    --accent: #e0788f;
    --accent-fg: #2a0f18;
    --ok: #6fcf94;
    --warn: #e5a063;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 640px; margin: 0 auto; display: grid; gap: 22px; }
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(2rem, 8vw, 2.7rem);
  line-height: 1.1;
  margin: 0 0 8px;
  text-wrap: balance;
}
h2 {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  margin: 0 0 8px;
}
.lead { margin: 0; color: var(--muted); max-width: 52ch; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }

.name-row { padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--cell); }
.name-row label { display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.name-row input {
  width: 100%; font: inherit; font-size: 19px; font-weight: 600; color: var(--fg);
  background: transparent; border: 0; padding: 4px 0; outline: none;
}
.name-row input::placeholder { color: var(--muted); font-weight: 400; opacity: 0.6; }
.name-row:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }

.wine { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; border-bottom: 1px solid var(--line); }
.wine .info { flex: 1 1 auto; min-width: 0; }
.wine .info b { display: block; font-weight: 500; font-size: 17px; }
.wine .info small { display: block; color: var(--muted); font-size: 13px; line-height: 1.3; }
.wine .rem { font-size: 13px; color: var(--ok); font-weight: 600; }
.wine.has .info b { color: var(--accent); font-weight: 600; }
.wine.out { opacity: 0.45; }
.wine.out .rem { color: var(--muted); }
.wine.over .rem { color: var(--warn); }
.step { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
.step button {
  width: 44px; height: 44px; font: inherit; font-size: 22px; line-height: 1; color: var(--fg);
  background: var(--cell); border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
}
.step button:active { background: var(--line); }
.step button:disabled { opacity: 0.35; cursor: default; }
.step input {
  width: 3.4rem; height: 44px; padding: 0; text-align: center; font: inherit; font-size: 18px; font-weight: 600;
  color: var(--fg); background: var(--cell); border: 1px solid var(--line); border-radius: 10px;
  font-variant-numeric: tabular-nums; -moz-appearance: textfield;
}
.step input::-webkit-outer-spin-button, .step input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.wine.has .step input { border-color: var(--accent); }
.step input:disabled { opacity: 1; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px; background: var(--cell); font-variant-numeric: tabular-nums; }
.total span { color: var(--muted); }
.total b { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; line-height: 1.1; }
.go {
  display: block; width: 100%; font: inherit; font-size: 18px; font-weight: 600; color: var(--accent-fg);
  background: var(--accent); border: 0; padding: 16px; cursor: pointer;
}
.go:active { filter: brightness(0.92); }
.go:disabled { opacity: 0.55; cursor: default; }
.msg { padding: 12px 14px; font-size: 14px; border-top: 1px solid var(--line); }
.msg.err { color: var(--warn); }
.banner { background: var(--surface); border: 1px solid var(--ok); color: var(--ok); border-radius: 12px; padding: 14px 16px; font-weight: 600; }
.note { border: 1px dashed var(--line); border-radius: 12px; padding: 14px 16px; color: var(--muted); }
.note.err { color: var(--warn); }

.orders { display: grid; gap: 10px; }
.ord { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.ord-top { display: flex; flex-direction: column; align-items: stretch; gap: 8px; margin-bottom: 6px; }
.ord-name { font-family: var(--font-display); font-size: 1.2rem; line-height: 1.2; min-width: 0; overflow-wrap: anywhere; }
.ord-del { font: inherit; font-size: 13px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; flex: 0 0 auto; }
.ord-del.armed { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.ord-line { display: flex; gap: 10px; padding: 2px 0; }
.ord-line b { min-width: 1.6rem; text-align: right; font-variant-numeric: tabular-nums; color: var(--accent); }
.ord-tot { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 14px; }
.ord-tot b { color: var(--fg); font-size: 17px; font-variant-numeric: tabular-nums; }
.sync { font-size: 12px; color: var(--muted); }
.ord.done { opacity: .55; filter: grayscale(1); background: var(--line); }
.ord-done { font-size: 12px; font-weight: 600; color: var(--muted); }
.ord-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.ord-edit { font: inherit; font-size: 13px; color: var(--accent); background: transparent; border: 1px solid var(--accent); border-radius: 8px; padding: 8px 12px; cursor: pointer; flex: 0 0 auto; }
.editbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid var(--accent); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; color: var(--accent); font-weight: 600; }
.editbar button { font: inherit; font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Vino da vendere</h1>
    <p class="lead">Scrivi il tuo nome, scegli i cartoni (o le bottiglie singole avanzate) che vuoi e premi Ordina. Puoi prendere più vini insieme. I cartoni che restano si aggiornano da soli.</p>
  </header>

  <div class="banner" id="banner" hidden></div>

  <section>
    <h2>Il tuo ordine</h2>
    <div class="editbar" id="editbar" hidden><span id="edittxt"></span><button id="editcancel" type="button">Annulla modifica</button></div>
    <div class="box">
      <div class="name-row">
        <label for="nome">Nome</label>
        <input id="nome" type="text" maxlength="40" autocomplete="name" placeholder="Il tuo nome">
      </div>
      <div id="wines"><div class="note" style="border:0;border-radius:0">Carico i vini…</div></div>
      <div class="total"><span id="t-cart">0 cartoni</span><b id="t-eur">0 €</b></div>
      <div class="msg err" id="msg" hidden></div>
      <button class="go" id="go" type="button" disabled>Ordina</button>
    </div>
  </section>

  <section>
    <h2 id="oh">Ordini confermati</h2>
    <div class="orders" id="orders"></div>
    <div class="note" id="oempty">Nessun ordine confermato ancora.</div>
    <p class="sync" id="sync"></p>
  </section>
</main>

<script>
(function () {
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fmt(n) { return n.toLocaleString("it-IT"); }
  function eur(n) { return n.toLocaleString("it-IT", { style: "currency", currency: "EUR", minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var nomeEl = $("nome"), winesEl = $("wines"), goEl = $("go"), msgEl = $("msg"), bannerEl = $("banner");
  var tCart = $("t-cart"), tEur = $("t-eur"), ordersEl = $("orders"), oEmpty = $("oempty"), oh = $("oh"), syncEl = $("sync");

  var state = { vini: [], ordini: [] };
  var draft = {};          // wineId -> cartoni scelti
  var rows = {};           // wineId -> elementi della riga
  var sig = "";
  var mine = load("vino_miei", []);   // [{id, token}] ordini fatti da questo telefono
  var admin = "";
  try {
    var qp = new URLSearchParams(location.search).get("admin");
    if (qp) save("vino_admin", qp);
  } catch (e) {}
  admin = load("vino_admin", "") || "";
  var busy = false, bannerTimer = null;

  nomeEl.value = load("vino_nome", "") || "";
  nomeEl.addEventListener("input", function () { save("vino_nome", nomeEl.value); hideMsg(); updateGo(); });

  var editing = null;      // {id, orig:{vino:cartoni}, nome, prevNome} quando l'amministratore modifica un ordine
  var editbarEl = $("editbar"), edittxtEl = $("edittxt");
  function rem(w) {
    var own = editing ? (editing.orig[w.id] || 0) : 0;
    return Math.max(0, w.cartoni - w.venduti + own);
  }
  function updateEditUI() {
    editbarEl.hidden = !editing;
    if (editing) edittxtEl.textContent = "Stai modificando l'ordine di " + editing.nome + ".";
    goEl.textContent = editing ? "Salva modifiche" : "Ordina";
  }
  function startEdit(o) {
    var prev = editing ? editing.prevNome : nomeEl.value;
    editing = { id: o.id, orig: Object.assign({}, o.righe), nome: o.nome, prevNome: prev };
    draft = Object.assign({}, o.righe);
    nomeEl.value = o.nome;
    hideMsg(); clampDraft(); updateEditUI(); paint();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function endEdit() {
    if (!editing) return;
    nomeEl.value = editing.prevNome || "";
    editing = null; draft = {};
    hideMsg(); updateEditUI(); paint();
  }
  $("editcancel").addEventListener("click", endEdit);
  function isB(w) { return /-b$/.test(w.id); }
  function cnt(n, b) { return b ? (n === 1 ? "1 bottiglia" : fmt(n) + " bottiglie") : (n === 1 ? "1 cartone" : fmt(n) + " cartoni"); }
  function totTxt(c, b) { var p = []; if (c || !b) p.push(cnt(c, false)); if (b) p.push(cnt(b, true)); return p.join(" + "); }
  function wineById(id) { return state.vini.filter(function (w) { return w.id === id; })[0]; }
  function hideMsg() { msgEl.hidden = true; msgEl.textContent = ""; }
  function showMsg(t) { msgEl.textContent = t; msgEl.hidden = false; }

  function clampDraft() {
    state.vini.forEach(function (w) {
      var q = draft[w.id] || 0, r = rem(w);
      if (q > r) draft[w.id] = r;
      if (!draft[w.id]) delete draft[w.id];
    });
  }

  function buildRows() {
    winesEl.textContent = "";
    rows = {};
    state.vini.forEach(function (w) {
      var row = el("div", "wine");
      var info = el("div", "info");
      info.appendChild(el("b", null, w.nome));
      var sub = w.cantina + " · " + eur(w.prezzo) + (isB(w) ? " a bottiglia" : " a cartone");
      info.appendChild(el("small", null, sub));
      var remEl = el("div", "rem");
      info.appendChild(remEl);
      var step = el("div", "step");
      var minus = el("button", null, "−"); minus.type = "button"; minus.setAttribute("aria-label", (isB(w) ? "Una bottiglia in meno: " : "Un cartone in meno: ") + w.nome);
      var inp = el("input"); inp.type = "number"; inp.inputMode = "numeric"; inp.min = "0"; inp.step = "1"; inp.placeholder = "0";
      inp.id = "q-" + w.id; inp.setAttribute("aria-label", "Cartoni di " + w.nome);
      var plus = el("button", null, "+"); plus.type = "button"; plus.setAttribute("aria-label", (isB(w) ? "Una bottiglia in più: " : "Un cartone in più: ") + w.nome);
      step.append(minus, inp, plus);
      row.append(info, step);
      winesEl.appendChild(row);
      rows[w.id] = { row: row, rem: remEl, inp: inp, minus: minus, plus: plus };

      function set(v) {
        var max = rem(wineById(w.id) || w);
        v = Math.max(0, Math.min(max, Math.floor(v) || 0));
        if (v) draft[w.id] = v; else delete draft[w.id];
        hideMsg(); paint();
      }
      minus.addEventListener("click", function () { set((draft[w.id] || 0) - 1); });
      plus.addEventListener("click", function () { set((draft[w.id] || 0) + 1); });
      inp.addEventListener("input", function () { var raw = inp.value; set(raw === "" ? 0 : Number(raw)); if (raw === "") inp.value = ""; });
    });
  }

  function paint() {
    var cart = 0, bot = 0, money = 0;
    state.vini.forEach(function (w) {
      var r = rows[w.id]; if (!r) return;
      var q = draft[w.id] || 0, left = rem(w);
      if (isB(w)) bot += q; else cart += q;
      money += q * w.prezzo;
      r.row.classList.toggle("has", q > 0);
      r.row.classList.toggle("out", left <= 0);
      r.rem.textContent = left <= 0 ? "esaurito" : (left === 1 ? "resta " + cnt(1, isB(w)) : "restano " + cnt(left, isB(w)));
      if (document.activeElement !== r.inp) r.inp.value = q ? String(q) : "";
      r.inp.max = String(left);
      r.inp.disabled = left <= 0;
      r.plus.disabled = left <= 0 || q >= left;
      r.minus.disabled = q <= 0;
    });
    tCart.textContent = totTxt(cart, bot);
    tEur.textContent = eur(money);
    updateGo();
  }

  function updateGo() {
    var any = Object.keys(draft).length > 0;
    goEl.disabled = busy || !any || !nomeEl.value.trim();
  }

  function renderOrders() {
    ordersEl.textContent = "";
    var list = state.ordini.slice().reverse();
    list.forEach(function (o) {
      var card = el("div", "ord");
      var top = el("div", "ord-top");
      top.appendChild(el("div", "ord-name", o.nome));
      var isMine = mine.some(function (m) { return m.id === o.id; });
      var btns = el("div", "ord-btns");
      var closed = !!o.chiuso;
      if (closed) card.classList.add("done");
      if (admin) {
        var cb = el("button", "ord-edit", closed ? "Riapri" : "Consegnato e pagato"); cb.type = "button";
        cb.addEventListener("click", function () { setClosed(o, !closed, cb); });
        btns.appendChild(cb);
      }
      if (closed) { if (!admin) btns.appendChild(el("span", "ord-done", "Consegnato e pagato")); }
      else if (admin) {
        var eb = el("button", "ord-edit", "Modifica"); eb.type = "button";
        eb.addEventListener("click", function () { startEdit(o); });
        btns.appendChild(eb);
      }
      if (!closed && (isMine || admin)) {
        var b = el("button", "ord-del", "Annulla ordine"); b.type = "button";
        var timer = null;
        b.addEventListener("click", function () {
          if (!b.classList.contains("armed")) {
            b.classList.add("armed"); b.textContent = "Sicuro? Tocca di nuovo";
            timer = setTimeout(function () { b.classList.remove("armed"); b.textContent = "Annulla ordine"; }, 3500);
            return;
          }
          clearTimeout(timer); cancelOrder(o.id, b);
        });
        btns.appendChild(b);
      }
      if (btns.children.length) top.appendChild(btns);
      card.appendChild(top);
      var cart = 0, bot = 0, money = 0;
      state.vini.forEach(function (w) {
        var q = o.righe[w.id]; if (!q) return;
        if (isB(w)) bot += q; else cart += q;
        money += q * w.prezzo;
        var line = el("div", "ord-line");
        line.appendChild(el("b", null, fmt(q)));
        line.appendChild(el("span", null, w.nome + " · " + w.cantina + (isB(w) ? " (bottiglie)" : "")));
        card.appendChild(line);
      });
      var tot = el("div", "ord-tot");
      tot.appendChild(el("span", null, "Totale " + totTxt(cart, bot)));
      tot.appendChild(el("b", null, eur(money)));
      card.appendChild(tot);
      ordersEl.appendChild(card);
    });
    oEmpty.hidden = list.length > 0;
    oh.textContent = list.length ? "Ordini confermati (" + list.length + ")" : "Ordini confermati";
  }

  function apply(data) {
    var nsig = data.vini.map(function (w) { return w.id + "|" + w.nome + "|" + w.cantina + "|" + w.prezzo; }).join(";");
    state = data;
    mine = mine.filter(function (m) { return state.ordini.some(function (o) { return o.id === m.id; }); });
    save("vino_miei", mine);
    clampDraft();
    if (nsig !== sig) { sig = nsig; buildRows(); }
    paint();
    renderOrders();
  }

  function refresh() {
    return fetch("/api/stato", { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    }).then(function (d) {
      apply(d);
      syncEl.textContent = "";
    }).catch(function () {
      if (!state.vini.length) {
        winesEl.textContent = "";
        var n = el("div", "note err", "Non riesco a caricare i vini. Riprova tra poco.");
        n.style.border = "0"; n.style.borderRadius = "0";
        winesEl.appendChild(n);
      }
      syncEl.textContent = "Connessione assente, riprovo…";
    });
  }

  function showBanner(t) {
    bannerEl.textContent = t; bannerEl.hidden = false;
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(function () { bannerEl.hidden = true; }, 12000);
  }

  goEl.addEventListener("click", function () {
    var nome = nomeEl.value.trim();
    if (!nome) { showMsg("Scrivi il tuo nome."); return; }
    if (!Object.keys(draft).length) { showMsg("Scegli almeno un cartone o una bottiglia."); return; }
    busy = true; goEl.textContent = "Invio…"; updateGo(); hideMsg();
    var isEdit = !!editing;
    var hdrs = { "content-type": "application/json" };
    if (isEdit) hdrs["x-admin"] = admin;
    fetch(isEdit ? "/api/ordine?id=" + encodeURIComponent(editing.id) : "/api/ordine", {
      method: isEdit ? "PUT" : "POST",
      headers: hdrs,
      body: JSON.stringify({ nome: nome, righe: draft })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, body: j }; });
    }).then(function (res) {
      if (res.status === 200 && res.body.id) {
        if (isEdit) {
          endEdit();
          showBanner("Ordine di " + nome + " modificato.");
          window.scrollTo({ top: 0, behavior: "smooth" });
          return refresh();
        }
        mine.push({ id: res.body.id, token: res.body.token }); save("vino_miei", mine);
        draft = {};
        showBanner("Ordine confermato. Grazie " + nome + "!");
        window.scrollTo({ top: 0, behavior: "smooth" });
        return refresh();
      }
      if (res.status === 409) {
        showMsg("Mentre sceglievi alcuni cartoni sono finiti. Ho aggiornato le quantità: controlla e premi di nuovo Ordina.");
        return refresh();
      }
      showMsg(res.body.error || "Non sono riuscito a salvare l'ordine. Riprova.");
    }).catch(function () {
      showMsg("Connessione assente. Riprova tra poco.");
    }).then(function () {
      busy = false; updateEditUI(); updateGo();
    });
  });

  function setClosed(o, v, btn) {
    btn.disabled = true;
    fetch("/api/ordine?id=" + encodeURIComponent(o.id), { method: "PATCH", headers: { "content-type": "application/json", "x-admin": admin }, body: JSON.stringify({ chiuso: v ? 1 : 0 }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) {
        showBanner(r.ok ? (v ? "Ordine segnato come consegnato e pagato." : "Ordine riaperto.") : "Non sono riuscito ad aggiornare l'ordine (errore " + r.status + (j.error ? ": " + j.error : "") + ").");
        if (!r.ok) btn.disabled = false; return refresh(); }); })
      .catch(function () { btn.disabled = false; showBanner("Connessione assente. Riprova tra poco."); });
  }

  function cancelOrder(id, btn) {
    var m = mine.filter(function (x) { return x.id === id; })[0];
    var headers = {};
    if (m) headers["x-token"] = m.token;
    if (admin) headers["x-admin"] = admin;
    btn.disabled = true;
    fetch("/api/ordine?id=" + encodeURIComponent(id), { method: "DELETE", headers: headers }).then(function (r) {
      if (r.ok) { mine = mine.filter(function (x) { return x.id !== id; }); save("vino_miei", mine); showBanner("Ordine annullato."); }
      else { btn.disabled = false; showBanner("Non sono riuscito ad annullare l'ordine."); }
      return refresh();
    }).catch(function () { btn.disabled = false; showBanner("Connessione assente. Riprova tra poco."); });
  }

  refresh();
  setInterval(function () { if (document.visibilityState === "visible" && !busy) refresh(); }, 8000);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") refresh(); });
})();
</script>
</body>
